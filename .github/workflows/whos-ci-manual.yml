name: WHOS CI Manual Verification
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'PR head verification target'
        required: false
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - run: npx playwright install --with-deps chromium
      - run: npm test
