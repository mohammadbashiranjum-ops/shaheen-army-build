body { background:#0a0a0a; color:#e0e0e0; font-family:Arial,sans-serif; margin:0; padding:8px; font-size:15px; }

.header p { margin:4px 0 0; font-size:12px; color:#888; }
.header .settings-btn { position:absolute; top:10px; right:10px; background:#2a2a4a; border:1px solid #4a4a6a; color:#ffd700; width:36px; height:36px; border-radius:8px; font-size:18px; cursor:pointer; }

.status-err { background:#3d0a0a; color:#ff8888; }

.msg-user { background:#0a3d0a; color:#b8ffb8; margin-left:20%; text-align:right; border:1px solid #1a5d1a; }

.msg-sys { background:#1a1a2e; color:#88aaff; text-align:center; font-size:12px; border:1px solid #2a2a4a; }
.msg-err { background:#3d0a0a; color:#ff8888; border:1px solid #5d1a1a; }
.msg pre { background:#0a0a0a; padding:8px; border-radius:6px; overflow-x:auto; font-size:12px; margin:4px 0; }
.msg img { max-width:100%; border-radius:8px; margin-top:6px; }
.msg small { color:#888; font-size:11px; display:block; margin-bottom:2px; }
.input-box { display:flex; gap:6px; position:sticky; bottom:0; background:#0a0a0a; padding-top:6px; align-items:center; }
.input-box input[type="text"] { flex:1; padding:12px; border-radius:10px; border:1px solid #333; background:#1a1a1a; color:#fff; font-size:15px; min-width:0; }

.input-box label.photo-btn { padding:12px 14px; border-radius:10px; background:#f80; color:#000; font-weight:bold; font-size:18px; cursor:pointer; display:inline-block; }

.photo-preview { margin-top:6px; text-align:center; }
.photo-preview img { max-width:200px; border-radius:8px; }

.card { background:#1a1a1a; padding:10px; border-radius:10px; margin-bottom:8px; border:1px solid #2a2a4a; }
.card h3 { margin:0 0 6px; font-size:14px; color:#ffd700; }
.card button { min-height:44px; padding:8px 14px; border-radius:8px; border:none; background:#f80; color:#000; font-weight:bold; }
.pill { display:inline-block; padding:4px 10px; border-radius:6px; font-size:12px; font-weight:bold; margin:2px 4px 2px 0; }

<script>
const WHOS_URL = "https://whos-backend-production.up.railway.app";
const WHOS_API = "/api/v1";

// Secrets (WHOS token, Groq key, GitHub token) live in memory only: gone on reload/close.
let whosToken = "";
let whosEmailSaved = "";
let key = "";
let ghToken = "";
let expiryTimer = null;
let pendingPhoto = null;
const L = ShaheenLib;

// ---- Live status (public GET only) ----
let lastLive = null, lastGood = null, liveBusy = false;
function renderLive(loading) {
  const el = document.getElementById('liveBody');
  if (loading) { el.textContent = '⏳ Check ho raha hai...'; return; }
  const st = LiveWeek.cardState(lastLive, lastGood, Date.now());
  const pill = (name, v, part) => '<span class="pill ' + (v === 'LIVE' ? 'live' : 'unknown') + '">' + name + ': ' + v + (part && !part.ok && part.detail ? ' (' + L.escapeHtml(part.detail) + ')' : '') + '</span>';
  let h = pill('Backend', st.health, lastLive && lastLive.health) + pill('Catalog', st.catalog, lastLive && lastLive.catalog);
  if (lastLive && lastLive.catalog.ok) h += '<br>📦 Public items: <b>' + lastLive.catalog.count + '</b>';
  if (lastLive && lastLive.health.ok && lastLive.health.commit) h += '<br><small>build ' + L.escapeHtml(lastLive.health.commit) + '</small>';
  if (st.kind === 'STALE') h += '<br>⚠️ Abhi check fail; aakhri kamyab check ' + new Date(st.lastGoodAt).toLocaleTimeString() + ' (purana).';
  if (st.kind === 'ERROR') h += '<br>❌ Status maloom nahi' + (st.lastGoodAt ? ' (aakhri kamyab ' + new Date(st.lastGoodAt).toLocaleTimeString() + ')' : '') + '.';
  if (lastLive) h += '<br><small>Checked ' + new Date(lastLive.checkedAt).toLocaleTimeString() + '</small>';
  el.innerHTML = h;
  renderPipe(st);
}
function renderPipe(st) {
  const el = document.getElementById('pipeBody');
  const cat = lastLive && lastLive.catalog.ok ? lastLive : (st.kind === 'STALE' ? lastGood : null);
  if (!cat) { el.textContent = '❓ Catalog maloom nahi (UNKNOWN).'; return; }
  const sum = LiveWeek.pipelineSummary(cat.catalog.items);
  let h = (cat === lastLive ? '' : '<b>⚠️ Purana data</b><br>') + 'Public items: <b>' + sum.total + '</b> — ' +
    Object.keys(sum.byAvailability).map(k => L.escapeHtml(k) + ': ' + sum.byAvailability[k]).join(', ') + '<br>';
  h += cat.catalog.items.map(i => '• ' + L.escapeHtml(i.sku || '?') + ' — ' + L.escapeHtml(i.title) + ' — ' + L.escapeHtml(i.currency + ' ' + i.price) + ' (' + L.escapeHtml(i.availability) + ')').join('<br>');
  h += '<br><small>Facebook/Instagram publish status yahan nahi dikhta (public API mein nahi).</small>';
  el.innerHTML = h;
}
async function refreshLive() {
  if (liveBusy) return; liveBusy = true; renderLive(true);
  try {
    lastLive = await LiveWeek.checkLive(fetch, Date.now());
    if (lastLive.health.ok && lastLive.catalog.ok) lastGood = lastLive;
  } finally { liveBusy = false; renderLive(false); }
}

// ---- Marketing Week checklist (localStorage only; non-secret) ----
function toggleWeek() {
  const p = document.getElementById('weekPanel');
  p.classList.toggle('hidden');
  if (!p.classList.contains('hidden')) renderWeek();
}
function renderWeek() {
  const key = LiveWeek.weekKey(new Date());
  let store = null; try { store = window.localStorage; } catch (e) {}
  const checks = store ? LiveWeek.loadChecks(store, key) : {};
  const body = document.getElementById('weekBody');
  body.textContent = '';
  LiveWeek.MARKETING_WEEK.forEach(it => {
    const row = document.createElement('label'); row.className = 'week-row';
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!checks[it.day];
    cb.onchange = () => { checks[it.day] = cb.checked; if (store) LiveWeek.saveChecks(store, key, checks); };
    const tx = document.createElement('span'); tx.textContent = it.day + ' — ' + it.task;
    row.appendChild(cb); row.appendChild(tx); body.appendChild(row);
  });
}

function toggleSettings() {
  document.getElementById('settingsPanel').classList.toggle('hidden');
}

async function whosLogin() {
  const email = document.getElementById('whosEmail').value.trim();
  const pass = document.getElementById('whosPass').value;
  if (!email || !pass) { addMsg('err','❌ Email aur password daalein.'); return; }
  
  addMsg('sys','🔐 WHOS login...');
  try {
    const r = await fetch(WHOS_URL + WHOS_API + '/auth/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ identifier: email, password: pass })
    });
    let d = null;
    try { d = await r.json(); } catch (e) {}
    if (d && (d.accessToken || d.access_token || d.token)) {
      whosToken = d.accessToken || d.access_token || d.token;
      whosEmailSaved = email;
      document.getElementById('whosPass').value = '';
      showLoggedIn();
      armExpiry();
      addMsg('ai','✅ WHOS login successful! Token sirf is page ki memory mein hai; reload par dobara login hoga.');
    } else {
      addMsg('err', escapeHtml(L.describeError('Login', { status: r.status, data: d })));
    }
  } catch(e) {
    addMsg('err','❌ Login error: ' + escapeHtml(L.redact(e.message)));
  }
}

function showLoggedIn() {
  document.getElementById('whosLoginBox').classList.add('hidden');
  document.getElementById('whosInfoBox').classList.remove('hidden');
  document.getElementById('whosUser').textContent = whosEmailSaved;
  const st = document.getElementById('whosStatus');
  st.className = 'status status-ok';
  st.textContent = '✅ WHOS Logged In';
}

function armExpiry() {
  clearTimeout(expiryTimer);
  const exp = L.tokenExpiryMs(whosToken);
  if (!exp) return;
  expiryTimer = setTimeout(() => { addMsg('err','⏱️ Token expire ho gaya. Dobara login karein.'); doLogout(); }, Math.min(Math.max(exp - Date.now(), 0), 2147483647));
}

function whosLogout() {
  if (!confirm('Logout karna chahte hain?')) return;
  doLogout();
}

function doLogout() {
  clearTimeout(expiryTimer);
  const old = whosToken;
  whosToken = "";
  if (old) L.request(fetch, WHOS_URL + WHOS_API + '/auth/logout', old, { method: 'POST' }); // revoke session, best effort
  document.getElementById('whosInfoBox').classList.add('hidden');
  document.getElementById('whosLoginBox').classList.remove('hidden');
  document.getElementById('whosStatus').className = 'status status-err';
  document.getElementById('whosStatus').textContent = '🔓 Logged out';
  addMsg('sys','WHOS logout ho gaya.');
}

async function whosCall(path, method = "GET", body = null) {
  if (!whosToken) return { ok:false, status:0, error:"WHOS login required" };
  const opts = { method };
  if (body) { opts.body = JSON.stringify(body); opts.headers = { "Content-Type": "application/json" }; }
  const r = await L.request(fetch, WHOS_URL + WHOS_API + path, whosToken, opts);
  if (r.status === 401) { addMsg('err','❌ WHOS token expire. Dobara login karein.'); doLogout(); }
  return r;
}

async function pilotDashboard() {
  if (!whosToken) { addMsg('err','❌ Pehle WHOS login karein (⚙️ Settings).'); return; }
  addMsg('sys','📊 Dashboard laa raha hoon...');
  const r = await whosCall('/inventory/pilot/dashboard');
  if (r.ok && r.data) {
    const d = r.data;
    let out = '📊 <b>INVENTORY DASHBOARD</b><br><br>';
    out += '📦 Total: <b>' + d.total + '</b> | ✅ Actionable: <b>' + d.actionable + '</b><br><br>';
    for (const [status, count] of Object.entries(d.byStatus || {})) {
      out += '• ' + status + ': <b>' + count + '</b><br>';
    }
    out += '<br><b>Top 10:</b><br>';
    (d.items || []).slice(0, 10).forEach((it, i) => {
      out += (i+1) + '. ' + it.sku + ' — ' + it.item + '<br>';
    });
    addMsg('ai', out);
  } else {
    addMsg('err', escapeHtml(L.describeError('Dashboard', r)));
  }
}

// Publish All is locked (L.PUBLISH_UNLOCKED=false) until backend PR #816 is merged.
// No publish/POST code exists here on purpose. Later it must go: approval draft -> Owner confirm -> separate exact step.
function publishAll() { addMsg('sys','🔒 Publish All band hai jab tak backend PR #816 merge nahi hota.'); }

async function showPrBoard() {
  addMsg('sys','🔀 PR board (read-only)...');
  const r = await L.loadPrBoard(fetch, ghToken);
  if (r.error) { addMsg('err', escapeHtml(r.error)); return; }
  if (!r.prs.length) { addMsg('ai','Koi open PR nahi.'); return; }
  addMsg('ai','<small>🦅 '+L.BACKEND_REPO+'</small>' + r.prs.map(p =>
    '#'+p.number+' '+escapeHtml(p.title)+(p.draft?' (draft)':'')+'<br>&nbsp;&nbsp;'+p.sha+' • CI: <b>'+escapeHtml(p.ci)+'</b> • Review: <b>'+escapeHtml(p.review)+'</b>').join('<br><br>'));
}

function showOwnerKaam() {
  const chat = document.getElementById('chat');
  addMsg('ai','<small>📝 Owner kaam (copy karke bhej dein)</small>');
  L.OWNER_KAAM.forEach(k => {
    const d = chat.lastElementChild;
    d.appendChild(document.createElement('br'));
    const t = document.createElement('div'); t.textContent = '• ' + k.title; d.appendChild(t);
    const b = document.createElement('button'); b.className = 'copy-btn'; b.textContent = '📋 Copy';
    b.onclick = () => navigator.clipboard.writeText(k.text).then(() => { b.textContent = '✅ Copied'; }, () => { b.textContent = '❌ Copy nahi hua'; });
    d.appendChild(b);
  });
}

async function showSpend() {
  addMsg('sys','💰 Kharcha (read-only)...');
  const r = await L.loadSpend(fetch, ghToken, L.BACKEND_REPO.split('/')[0]);
  if (r.error) { addMsg('err', escapeHtml(r.error)); return; }
  addMsg('ai','GitHub Actions is mahine: <b>$'+r.actionsNetUsd+'</b> ('+r.lines+' lines)<br>Railway: API se abhi safe nahi — dashboard par dekhein.');
}

function saveGh() {
  const k = document.getElementById('ghtoken').value.trim();
  if (!k) { addMsg('err','❌ Token khali hai.'); return; }
  ghToken = k; document.getElementById('ghtoken').value = '';
  addMsg('sys','✅ GitHub token memory mein (reload par ud jayega).');
}

function handlePhoto(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    pendingPhoto = e.target.result;
    document.getElementById('previewImg').src = pendingPhoto;
    document.getElementById('photoPreview').classList.remove('hidden');
  };
  reader.readAsDataURL(file);
}

function removePhoto() {
  pendingPhoto = null;
  document.getElementById('photoInput').value = '';
  document.getElementById('photoPreview').classList.add('hidden');
}

function saveKey() {
  const k = document.getElementById('apikey').value.trim();
  if (k && k !== '****SAVED****' && k.startsWith('gsk_')) {
    key = k;
    document.getElementById('apikey').value = '****SAVED****';
    addMsg('sys','✅ Groq key memory mein hai (reload par dobara daalni hogi).');
  } else if (k === '****SAVED****') {
    addMsg('sys','Key already saved.');
  } else {
    addMsg('err','❌ "gsk_" se shuru honi chahiye.');
  }
}

function addMsg(type, text, imgSrc) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg msg-' + type;
  div.innerHTML = text;
  if (imgSrc) {
    const img = document.createElement('img');
    img.src = imgSrc;
    div.appendChild(img);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
function clearChat() { document.getElementById('chat').innerHTML = '<div class="msg msg-sys">Cleared.</div>'; }
function quick(text) { document.getElementById('msg').value = text; send(); }
function escapeHtml(s) { return L.escapeHtml(s); }

const BRAINS = {
  programmer: "Senior Programmer. Clean code, debug. Short Roman Urdu+English.",
  marketing: "Marketing Specialist. Ads, SEO, income. Short Roman Urdu+English.",
  designer: "UI/UX Designer. Short Roman Urdu+English.",
  researcher: "Researcher. Current facts 2026. Short Roman Urdu+English.",
  psychologist: "Psychologist. Empathy, advice. Short Roman Urdu+English.",
  booster: "Booster. Motivate briefly. Roman Urdu+English.",
  planner: "Strategic Planner. Step-by-step, free tools. Roman Urdu+English.",
  economist: "Economist. Show income path. Reject if no income. Short.",
  smart_brain: "Smart Brain. Clear, concise. Roman Urdu+English."
};

function routeMessage(msg) {
  const m = msg.toLowerCase();
  if (/code|bug|program|python|api|error/.test(m)) return "programmer";
  if (/design|ui|ux|layout|color/.test(m)) return "designer";
  if (/marketing|ad|seo|income|paisa|kamai|sale|client/.test(m)) return "marketing";
  if (/research|find|verify|truth/.test(m)) return "researcher";
  if (/motivat|boost|tired|thak|energy/.test(m)) return "booster";
  if (/feel|emotion|sad|tension|stress/.test(m)) return "psychologist";
  if (/plan|mission|strategy|roadmap/.test(m)) return "planner";
  if (/income|expense|budget|profit|cost|kharach/.test(m)) return "economist";
  return "smart_brain";
}

async function send() {
  const input = document.getElementById('msg');
  const m = input.value.trim();
  if (!m && !pendingPhoto) return;
  addMsg('user', m || '(photo)', pendingPhoto);
  input.value = '';
  removePhoto();

  const lower = m.toLowerCase();

  if (m && /mission|inventory|project|task|whos|listing|expense|client/.test(lower)) {
    if (!whosToken) {
      addMsg('err','❌ Pehle WHOS mein login karein (⚙️ Settings).');
      return;
    }
    addMsg('sys','🔗 WHOS se data laa raha hoon...');
    try {
      let endpoint = null;
      if (/inventory/.test(lower)) endpoint = '/inventory';
      else if (/project/.test(lower)) endpoint = '/projects';
      else if (/task/.test(lower)) endpoint = '/tasks';
      else if (/client/.test(lower)) endpoint = '/clients';
      else if (/expense/.test(lower)) endpoint = '/expenses';
      else endpoint = '/tasks';

      const r = await whosCall(endpoint);
      if (r.status === 401) return; // whosCall already logged out
      if (r.ok && r.data != null) {
        const list = (endpoint === '/projects' || endpoint === '/tasks') ? L.normalizeList(r.data) : null;
        if (list) addMsg('ai','<small>🦅 WHOS '+endpoint+'</small>'+L.renderRows(list, endpoint.slice(1,-1)));
        else addMsg('ai','<small>🦅 WHOS '+endpoint+'</small><pre>'+escapeHtml(JSON.stringify(r.data, null, 2).slice(0, 2000))+'</pre>');
      } else {
        addMsg('err', escapeHtml(L.describeError('WHOS ' + endpoint, r)));
      }
      return;
    } catch(e) {
      addMsg('err','❌ WHOS error: ' + escapeHtml(L.redact(e.message)));
      return;
    }
  }

  if (!key) { addMsg('err','❌ Pehle Groq API Key set karein (⚙️ Settings).'); return; }
  const agent = routeMessage(m);
  addMsg('sys','🧠 ' + agent.toUpperCase() + ' soch raha hai...');
  try {
    const r = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method:'POST',
      headers:{'Authorization':'Bearer '+key,'Content-Type':'application/json'},
      body: JSON.stringify({
        model: 'openai/gpt-oss-20b',
        messages: [
          { role:'system', content: BRAINS[agent] || BRAINS.smart_brain },
          { role:'user', content: m || '(photo attached)' }
        ],
        max_tokens: 1000, temperature: 0.7
      })
    });
    const d = await r.json();
    if (d.choices && d.choices[0]) {
      const ans = d.choices[0].message.content;
      addMsg('ai','<small>🦅 '+agent.toUpperCase()+'</small>'+escapeHtml(ans).replace(/\n/g,'<br>'));
    } else if (d.error) { addMsg('err','❌ '+escapeHtml(L.redact(d.error.message||'Error'))); }
    else { addMsg('err','❌ Jawab nahi aya.'); }
  } catch(e) { addMsg('err','❌ '+e.message); }
}

refreshLive();
</script>
